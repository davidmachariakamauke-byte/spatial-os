name: Gemini Assistant

on:
  workflow_dispatch: # Enables manual trigger from GitHub Actions tab
  issue_comment:
    types: [created]

jobs:
  gemini:
    # Allows manual trigger OR comment containing @gemini-cli
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gemini CLI Action
        uses: google-github-actions/run-gemini-cli@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
