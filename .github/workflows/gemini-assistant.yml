name: Gemini Assistant

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Enter your prompt for the AI'
        required: true
        type: string
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  gemini:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini-cli')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-cli'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Run Gemini CLI Action
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          args: ${{ github.event.inputs.prompt || github.event.issue.body || github.event.comment.body }}
